[project]
name = "equine-edge"
version = "2.0.0"
description = "Track-agnostic race analysis for every TwinSpires track"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
edge = "edge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["edge*"]

[tool.setuptools.package-data]
edge = ["model/artifacts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
